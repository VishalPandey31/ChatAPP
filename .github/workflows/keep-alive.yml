name: Keep Backend Alive

on:
  schedule:
    # Run every 5 minutes to prevent Render free-tier from sleeping (15 min inactivity timeout)
    - cron: '*/5 * * * *'
  # Also allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health Endpoint
        run: |
          echo "Pinging backend to keep awake..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://chatapp-backend-s0td.onrender.com/api/health || true)
          echo "Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health endpoint returned $HTTP_STATUS, pinging root..."
            curl -s -o /dev/null --max-time 30 https://chatapp-backend-s0td.onrender.com/ || true
          fi
          echo "Ping completed successfully"
