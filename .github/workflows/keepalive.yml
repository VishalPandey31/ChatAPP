name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        run: |
          echo "Pinging https://chatapp-53it.onrender.com/ to keep the instance awake..."
          curl -s https://chatapp-53it.onrender.com/ > /dev/null
          echo "Ping successful!"
